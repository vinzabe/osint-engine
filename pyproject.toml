[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osint-engine"
version = "1.0.0"
description = "OSINT collection with provenance and PII minimisation by design: entity resolution across pluggable sources, every datum carries its source and collection time, PII is minimised/redacted by default, and retention is enforced as code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vinzabe", email = "gabejar@usa.com" }]
keywords = ["security", "osint", "reconnaissance", "privacy", "provenance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
osint = "osint.cli:main"

[project.urls]
Homepage = "https://github.com/vinzabe/osint-engine"
Issues = "https://github.com/vinzabe/osint-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/osint"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["osint"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S101", "ARG001", "ARG002", "ARG005", "F841"]
